<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gradBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="gradLR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gradRF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gradXGB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="950" height="420" rx="16" fill="url(#gradBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="35" y="42" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Comparative Model Benchmarking (Held-Out Test Set: 679 Hours)</text>
  <text x="35" y="66" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Mean Absolute Error (MAE in Watts) — Lower is Better | Peak Summer Laghouat Campaign</text>

  <!-- Grid lines -->
  <line x1="220" y1="90" x2="220" y2="340" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
  <line x1="370" y1="90" x2="370" y2="340" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
  <line x1="520" y1="90" x2="520" y2="340" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
  <line x1="670" y1="90" x2="670" y2="340" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
  <line x1="820" y1="90" x2="820" y2="340" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>

  <!-- Axis Labels -->
  <text x="220" y="360" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">0 W</text>
  <text x="370" y="360" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">5 W</text>
  <text x="520" y="360" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">10 W</text>
  <text x="670" y="360" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">15 W</text>
  <text x="820" y="360" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">20 W</text>

  <!-- Row 1: Naïve Baseline -->
  <text x="200" y="128" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="end">Naïve Baseline</text>
  <text x="200" y="145" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">(Historical Mean: 26.76 W)</text>
  <rect x="220" y="112" width="613" height="38" rx="6" fill="url(#gradBase)" opacity="0.85"/>
  <text x="845" y="136" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">20.45 W</text>

  <!-- Row 2: Ridge Linear Regression -->
  <text x="200" y="188" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="end">Ridge Linear Reg.</text>
  <text x="200" y="205" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">(λ = 1.0, R² = 0.9639)</text>
  <rect x="220" y="172" width="107" height="38" rx="6" fill="url(#gradLR)"/>
  <text x="340" y="196" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">3.58 W</text>
  <text x="405" y="196" fill="#fbbf24" font-family="sans-serif" font-size="12">[-82.5% Error]</text>

  <!-- Row 3: Random Forest -->
  <text x="200" y="248" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="end">Random Forest</text>
  <text x="200" y="265" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">(B = 30, R² = 0.9877)</text>
  <rect x="220" y="232" width="53" height="38" rx="6" fill="url(#gradRF)"/>
  <text x="285" y="256" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">1.77 W</text>
  <text x="350" y="256" fill="#60a5fa" font-family="sans-serif" font-size="12">[-91.3% Error]</text>

  <!-- Row 4: XGBoost Regressor (Winner) -->
  <text x="200" y="308" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">XGBoost Regressor</text>
  <text x="200" y="325" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">★ Selected Model (R² = 0.9928)</text>
  <rect x="220" y="292" width="37" height="38" rx="6" fill="url(#gradXGB)" filter="url(#glow)"/>
  <text x="270" y="316" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="800">1.24 W</text>
  <text x="335" y="316" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600">[-93.9% Error Reduction]</text>

  <!-- Bottom Metric Callouts -->
  <rect x="35" y="378" width="880" height="1" fill="#334155"/>
  <text x="50" y="402" fill="#94a3b8" font-family="sans-serif" font-size="12">RMSE Benchmarks: Naïve = 21.90 W  |  Ridge = 4.16 W  |  Random Forest = 2.43 W  |  <tspan fill="#34d399" font-weight="700">XGBoost = 1.85 W</tspan></text>
</svg>