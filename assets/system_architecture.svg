<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="activeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="260" rx="16" fill="url(#bgGrad5)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="34" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">End-to-End Predictive Maintenance Architecture &amp; Decision Framework</text>
  <text x="35" y="54" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">From Raw Environmental Telemetry to Condition-Based Cleaning Alarms &amp; SDG 7 Impact</text>

  <!-- Step 1: Telemetry -->
  <rect x="35" y="80" width="195" height="145" rx="10" fill="url(#cardGrad1)" stroke="#475569" stroke-width="1.2"/>
  <text x="132" y="105" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. SENSOR TELEMETRY</text>
  <text x="132" y="128" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">• In-Plane Irradiance (G_POA)</text>
  <text x="132" y="146" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">• Ambient &amp; Cell Temp (T_cell)</text>
  <text x="132" y="164" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">• Wind Velocity &amp; Humidity</text>
  <text x="132" y="182" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">• Continuous PCHIP Dust</text>
  <rect x="45" y="196" width="175" height="20" rx="4" fill="#0284c7" opacity="0.2"/>
  <text x="132" y="210" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">G_POA &gt; 10 W/m² Filter</text>

  <!-- Arrow 1 -->
  <path d="M 235 152 L 260 152 M 254 146 L 260 152 L 254 158" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Step 2: Feature Engineering -->
  <rect x="265" y="80" width="195" height="145" rx="10" fill="url(#cardGrad1)" stroke="#475569" stroke-width="1.2"/>
  <text x="362" y="105" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. DOMAIN FEATURES</text>
  <text x="362" y="128" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">• ΔT = T_cell - T_amb</text>
  <text x="362" y="146" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">• Derated Thermal POA</text>
  <text x="362" y="164" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">• Dry Spell Duration (H_dry)</text>
  <text x="362" y="182" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">• Harmonic Diurnal Angles</text>
  <rect x="275" y="196" width="175" height="20" rx="4" fill="#d97706" opacity="0.2"/>
  <text x="362" y="210" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Target Leakage Isolation</text>

  <!-- Arrow 2 -->
  <path d="M 465 152 L 490 152 M 484 146 L 490 152 L 484 158" stroke="#fbbf24" stroke-width="2" fill="none"/>

  <!-- Step 3: ML Inference -->
  <rect x="495" y="80" width="195" height="145" rx="10" fill="url(#activeCard)" stroke="#10b981" stroke-width="1.8" filter="url(#glowGreen)"/>
  <text x="592" y="105" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. XGBOOST INFERENCE</text>
  <text x="592" y="128" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">• Test MAE: 1.24 Watts</text>
  <text x="592" y="146" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">• Test RMSE: 1.85 Watts</text>
  <text x="592" y="164" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">• Goodness-of-Fit: R² = 0.9928</text>
  <text x="592" y="182" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">• Latency: &lt; 20 μs per sample</text>
  <rect x="505" y="196" width="175" height="20" rx="4" fill="#059669" opacity="0.4"/>
  <text x="592" y="210" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Edge Microcontroller Ready</text>

  <!-- Arrow 3 -->
  <path d="M 695 152 L 720 152 M 714 146 L 720 152 L 714 158" stroke="#34d399" stroke-width="2" fill="none"/>

  <!-- Step 4: Maintenance Action -->
  <rect x="725" y="80" width="190" height="145" rx="10" fill="url(#cardGrad1)" stroke="#475569" stroke-width="1.2"/>
  <text x="820" y="105" fill="#f43f5e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. DISPATCH TRIGGER</text>
  <text x="820" y="128" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">• Condition-Based Washing</text>
  <text x="820" y="146" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ΔP ≥ 10.0 W for ≥ 3 hrs</text>
  <text x="820" y="164" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">• Saves Up to 40% Water</text>
  <text x="820" y="182" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">• Recovers 13.4% Energy</text>
  <rect x="735" y="196" width="170" height="20" rx="4" fill="#be123c" opacity="0.2"/>
  <text x="820" y="210" fill="#fda4af" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">SDG 7.2 Energy Security</text>
</svg>